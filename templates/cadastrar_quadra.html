{% extends "base.html" %}
{% block title %}Cadastrar quadra{% endblock %}

{% block content %}
<div class="mb-6">
  <a href="{{ url_for('index') }}" class="inline-flex items-center gap-1 text-sm text-blue-600 hover:underline mb-2">
    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
    Casas
  </a>
  <h1 class="text-2xl font-bold tracking-tight text-slate-900">Cadastrar quadra</h1>
</div>

<form method="post" class="rounded-xl border border-slate-200 bg-white max-w-md">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

  <div class="px-6 pt-6">
    <h2 class="text-sm font-bold text-slate-900">Dados da quadra</h2>
  </div>
  <div class="form-grid">
    <div class="form-field md-span-2">
      <label class="form-label" for="numero_quadra">Número da quadra</label>
      <input class="form-input" id="numero_quadra" name="numero_quadra" type="number" min="1" value="{{ proximo_numero }}" required>
    </div>
  </div>

  <div class="form-actions border-t border-slate-100 px-6 py-4">
    <button class="btn-primary" type="submit">Salvar quadra</button>
    <a class="btn-secondary" href="{{ url_for('index') }}">Cancelar</a>
  </div>
</form>
{% endblock %}
