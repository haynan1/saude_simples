{% extends "base.html" %}
{% block title %}Editar casa{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto">
<div class="mb-6">
  <a href="{{ url_for('detalhes_casa', casa_id=casa.id) }}" class="inline-flex items-center gap-1 text-sm text-blue-600 hover:underline mb-2">
    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
    Casa {{ casa.numero_casa }}
  </a>
  <h1 class="text-2xl font-bold tracking-tight text-slate-900">Editar casa</h1>
</div>

<form method="post" class="rounded-xl border border-slate-200 bg-white">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

  <div class="px-6 pt-6">
    <h2 class="text-sm font-bold text-slate-900">Informações da casa</h2>
  </div>
  <div class="form-grid">
    <div class="form-field md-span-2">
      <label class="form-label" for="quadra_id">Quadra</label>
      <select class="form-input" id="quadra_id" name="quadra_id">
        <option value="">Sem quadra</option>
        {% for quadra in quadras %}
          <option value="{{ quadra.id }}" {% if casa.quadra_id == quadra.id %}selected{% endif %}>Quadra Nº {{ quadra.numero_quadra }}</option>
        {% endfor %}
      </select>
    </div>

    <div class="form-field md-span-2">
      <label class="form-label" for="tipo_imovel">Tipo de imóvel</label>
      {% set tipo_atual = casa.tipo_imovel or 'domicilio' %}
      <select class="form-input" id="tipo_imovel" name="tipo_imovel">
        {% for opcao in opcoes_tipos_imovel %}
          <option value="{{ opcao.codigo }}" {% if tipo_atual == opcao.codigo %}selected{% endif %}>{{ opcao.label }}</option>
        {% endfor %}
      </select>
    </div>

    <div class="form-field md-span-2">
      <label class="form-label" for="numero_casa">Número da casa</label>
      <input class="form-input" id="numero_casa" name="numero_casa" type="number" min="1" value="{{ casa.numero_casa }}" required>
    </div>

    <div class="form-field md-span-2">
      <label class="form-label" for="endereco">Endereço</label>
      <input class="form-input" id="endereco" name="endereco" type="text" value="{{ casa.endereco }}" required>
    </div>

    <div class="form-field md-span-2">
      <label class="flex items-start gap-3 rounded-lg border border-slate-200 bg-slate-50 px-4 py-3 cursor-pointer" for="contabilizar">
        <input
          class="mt-0.5 h-4 w-4 shrink-0 rounded border-slate-300 text-blue-600"
          id="contabilizar"
          name="contabilizar"
          type="checkbox"
          value="1"
          {% if casa|contabilizada %}checked{% endif %}
        >
        <span class="min-w-0">
          <span class="block text-sm font-semibold text-slate-900">Contar esta casa no relatório</span>
          <span class="block text-xs text-slate-500 mt-0.5">Desmarcado, a casa e os moradores dela saem das contagens do território, do perfil epidemiológico e das exportações. Continuam visíveis e editáveis aqui.</span>
        </span>
      </label>
    </div>
  </div>

  <div class="form-actions border-t border-slate-100 px-6 py-4">
    <button class="btn-primary" type="submit">Salvar alterações</button>
    <a class="btn-secondary" href="{{ url_for('detalhes_casa', casa_id=casa.id) }}">Cancelar</a>
  </div>
</form>
</div>
{% endblock %}
