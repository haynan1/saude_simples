{% extends "base.html" %}
{% block title %}Alterar senha{% endblock %}

{% block content %}
<div class="max-w-md mx-auto">
<div class="mb-6">
  <a href="{{ url_for('index') }}" class="inline-flex items-center gap-1 text-sm text-blue-600 hover:underline mb-2">
    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
    Início
  </a>
  <h1 class="text-2xl font-bold tracking-tight text-slate-900">Alterar senha</h1>
</div>

<form method="post" class="rounded-xl border border-slate-200 bg-white">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

  <div class="px-6 pt-6">
    <h2 class="text-sm font-bold text-slate-900">Senha de acesso</h2>
  </div>
  <div class="form-grid">
    <div class="form-field md-span-2">
      <label class="form-label" for="senha_atual">Senha atual</label>
      <input class="form-input" id="senha_atual" name="senha_atual" type="password" autocomplete="current-password" required autofocus>
    </div>

    <div class="form-field md-span-2">
      <label class="form-label" for="nova_senha">Nova senha</label>
      <input class="form-input" id="nova_senha" name="nova_senha" type="password" autocomplete="new-password" minlength="10" required>
      <p class="text-xs text-slate-500 mt-1.5">Mínimo de 10 caracteres.</p>
    </div>

    <div class="form-field md-span-2">
      <label class="form-label" for="confirmar_senha">Confirmar nova senha</label>
      <input class="form-input" id="confirmar_senha" name="confirmar_senha" type="password" autocomplete="new-password" minlength="10" required>
    </div>
  </div>

  <div class="form-actions border-t border-slate-100 px-6 py-4">
    <button class="btn-primary" type="submit">Salvar nova senha</button>
    <a class="btn-secondary" href="{{ url_for('index') }}">Cancelar</a>
  </div>
</form>
</div>
{% endblock %}
